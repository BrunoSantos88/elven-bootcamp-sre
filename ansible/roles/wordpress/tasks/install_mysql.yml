---
  - name: Instalacao mariadb e pip
    dnf:
      name:
        - mariadb105-server
        - mariadb105
        - python3-pip
      state: present

  - name: Instalacao PyMySQL via pip
    pip:
      name: PyMySQL
      executable: pip3

  - name: Iniciando e habilitando o servico mariadb
    service:
      name: mariadb
      state: started
      enabled: yes

  - name: Criando usuario no banco mysql
    mysql_user:
      name: "{{ db_user }}"
      password: "{{ db_password }}"
      priv: '*.*:ALL'
      host: "%"
      state: present
      login_unix_socket: /var/lib/mysql/mysql.sock

  - name: Criando database wordpress
    mysql_db:
      name: "{{ db_name }}"
      state: present
      login_unix_socket: /var/lib/mysql/mysql.sock
